# プレフィックスをCtrl+aに変更
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# マウス操作を有効
set -g mouse on

# ペイン分割
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 新規ウィンドウを現在のウィンドウの直後に開く
bind c new-window -a -c "#{pane_current_path}"

# リロード設定
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# 256色対応
set -g default-terminal "tmux-256color"

# ウィンドウとペインのインデックスを1から開始
set -g base-index 1
setw -g pane-base-index 1

# ウィンドウを閉じた時にインデックスを振り直し
set -g renumber-windows on

# Vimスタイルのペイン移動
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ペインサイズの調整
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# コピーモードをVimスタイルに
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# スクロールバック履歴を増やす
set -g history-limit 10000

# ESCキーの遅延を短くする（Vim使用時に重要）
set -sg escape-time 0

# フォーカスイベントを有効化（Vimのautoread等に必要）
set -g focus-events on

# OSCエスケープシーケンスを外側の端末へパススルー（Claude Code等のデスクトップ通知に必要）
# on だと不可視windowのペインからの通知が破棄されるため all を指定（別windowで作業中に通知が来ないと意味がない）
set -g allow-passthrough all

# Solarizedパレット（実際に参照するロールのみ定義。未参照のエントリは腐るため）
set -g @base02 "colour235"
set -g @yellow "colour136"
set -g @orange "colour166"

# ステータスバーの設定
set -g status-interval 1
set -g status-position bottom
set -g status-style "bg=#{@base02},fg=#{@yellow}"

# ウィンドウリストの設定
set -g window-status-current-style "bg=#{@orange},fg=#{@base02},bold"
set -g window-status-style "bg=#{@base02},fg=#{@yellow}"

# セッション名とウィンドウ情報を表示
set -g status-left-length 30
set -g status-left '[#S] '
set -g status-right '%Y-%m-%d %H:%M:%S'
