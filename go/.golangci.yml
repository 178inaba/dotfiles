version: "2"

# The linter set is enumerated rather than inherited from the running version's
# own default, so a golangci-lint upgrade changes diagnostics but never which
# linters are active. revive is here for its exported-doc-comment rule, which
# is how a required doc comment stops being something to notice by eye.
linters:
  default: none
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        # The documents internal/pullrequest and internal/worktree read are
        # published contracts, and contract.Unmarshal is the one way in that
        # holds a document to its declaration. Decoding one directly publishes
        # nothing and is checked by nothing, which is the defect the contract
        # exists to remove — so the package that would do it is denied rather
        # than the three functions that would be called from it: after the last
        # such call was moved to the entry point there is no legitimate
        # non-test use of json left in either place, and a rule about the
        # import needs no allowlist and no alias resolution.
        #
        # The prefix has no trailing $, so encoding/json, encoding/json/v2 and
        # encoding/json/jsontext are all denied. Tests are exempt: several in
        # both packages decode fixtures directly and are not contract readers.
        contract-readers:
          files:
            - "**/internal/pullrequest/**"
            - "**/internal/worktree/**"
            - "!$test"
          deny:
            - pkg: encoding/json
              desc: decode a contract document with contract.Unmarshal, which holds it to its declaration
    errcheck:
      # Informational writes to a diagnostic stream or a hash, and best-effort
      # cleanup where there is no meaningful recovery from a failure.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Remove
        - os.RemoveAll
        - (*os.File).Close
        - (*os.Root).Close
        - (io.ReadCloser).Close
        - (*github.com/178inaba/dotfiles/go/internal/hooks/state.Store).Close

# `golangci-lint run` reports a formatter's findings as ordinary issues, so the
# existing lint step already fails on unformatted code and ci.yml needs no gofmt
# step of its own — nothing else in the job looks at formatting, `go vet`
# included. Only gofmt is enabled: goimports, gofumpt and golines each impose a
# style beyond what `go fmt` itself defines.
formatters:
  enable:
    - gofmt
