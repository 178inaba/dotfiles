name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # ハング時に必須チェックが既定の6時間張り付くのを防ぐ
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          # モジュールキャッシュの探索先。既定はリポジトリルートの go.sum なので、
          # 指定しないと毎回ミスして "Restore cache failed" の注釈が付く
          cache-dependency-path: go/go.sum

      - name: Vet the Go module
        run: go -C go vet ./...

      # ローカル lint を docker で持たないので、cflio 等の compose.yaml 方式ではなく
      # ここを単一の正としてピン留めする。golangci-lint は自身のビルドに使われた Go より
      # 新しい go ディレクティブを拒否するため、go 1.27 には 1.27 でビルドされた
      # v2.13.0 以降が要る（v2.12.x は 1.26 ビルドで "can't load config" で落ちる）
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: go

      - name: Run Go tests
        run: go -C go test -race ./...
