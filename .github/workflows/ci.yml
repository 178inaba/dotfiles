name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # ハング時に必須チェックが既定の6時間張り付くのを防ぐ
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          # モジュールキャッシュの探索先。既定はリポジトリルートの go.sum なので、
          # 指定しないと毎回ミスして "Restore cache failed" の注釈が付く
          cache-dependency-path: go/go.sum

      - name: Vet the Go module
        run: go -C go vet ./...

      # golangci-lint は自身のビルドに使われた Go より新しい go ディレクティブを拒否する
      # ので、go 1.27 のモジュールには 1.27 でビルドされたリリースが要る（1.26 ビルドは
      # "can't load config" で落ちる）
      - uses: golangci/golangci-lint-action@v9
        with:
          version-file: .tool-versions
          working-directory: go

      - name: Run Go tests
        run: go -C go test -race ./...
