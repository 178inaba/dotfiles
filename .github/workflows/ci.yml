name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # ハング時に必須チェックが既定の6時間張り付くのを防ぐ
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # スイートが実行時に要求する外部コマンド（jq は大半のフック・スキルスクリプト、
      # lsof は cleanup-merged の inuse-lib.sh）。ランナーイメージの内容は変わるため
      # preinstall を信頼せず、欠けているものだけを入れる。どのツールも同じ深さで扱うので、
      # 依存が増えたときはこのリストに足すだけで済む
      - name: Ensure required tools
        run: |
          missing=""
          for tool in jq lsof; do
            command -v "$tool" >/dev/null || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "missing from the runner image:$missing"
            # イメージには apt のパッケージリストが焼き込まれているので update 無しで通ることが多い。
            # 毎回の update は数秒〜十数秒のネットワーク往復になるため、失敗したときだけ実行する
            sudo apt-get install -y $missing \
              || { sudo apt-get update && sudo apt-get install -y $missing; }
          fi

      - name: Run shell test suites
        run: bash claude/.claude/tests/run-all.sh
