name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # ハング時に必須チェックが既定の6時間張り付くのを防ぐ
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Go のステップをシェルスイートより前に置くのは、シェル側が Sub 4 で消えたときに
      # このジョブがそのまま Go 専用ジョブになり、チェック名が変わらないようにするため
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          # モジュールキャッシュの探索先。既定はリポジトリルートの go.sum なので、
          # 指定しないと毎回ミスして "Restore cache failed" の注釈が付く
          cache-dependency-path: go/go.sum

      - name: Vet the Go module
        run: go -C go vet ./...

      # ローカル lint を docker で持たないので、cflio 等の compose.yaml 方式ではなく
      # ここを単一の正としてピン留めする。golangci-lint は自身のビルドに使われた Go より
      # 新しい go ディレクティブを拒否するため、go 1.27 には 1.27 でビルドされた
      # v2.13.0 以降が要る（v2.12.x は 1.26 ビルドで "can't load config" で落ちる）
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: go

      - name: Run Go tests
        run: go -C go test -race ./...

      # スイートが実行時に要求する外部コマンド（jq は大半のフック・スキルスクリプト、
      # lsof は cleanup-merged の inuse-lib.sh）。ランナーイメージの内容は変わるため
      # preinstall を信頼せず、欠けているものだけを入れる。どのツールも同じ深さで扱うので、
      # 依存が増えたときはこのリストに足すだけで済む
      - name: Ensure required tools
        run: |
          missing=""
          for tool in jq lsof; do
            command -v "$tool" >/dev/null || missing="$missing $tool"
          done
          if [ -n "$missing" ]; then
            echo "missing from the runner image:$missing"
            # イメージには apt のパッケージリストが焼き込まれているので update 無しで通ることが多い。
            # 毎回の update は数秒〜十数秒のネットワーク往復になるため、失敗したときだけ実行する
            sudo apt-get install -y $missing \
              || { sudo apt-get update && sudo apt-get install -y $missing; }
          fi

      # スイートは claude/.claude/ の外（stow パッケージ shims/）にもあるため、
      # ランナーの既定ルートに任せず全ルートを明示する
      - name: Run shell test suites
        run: bash claude/.claude/tests/run-all.sh claude/.claude shims
